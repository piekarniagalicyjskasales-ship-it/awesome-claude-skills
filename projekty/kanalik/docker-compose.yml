services:
  kanalik:
    build: .
    image: kanalik:latest
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - kanalik-data:/data
    environment:
      TRUST_PROXY: "1"
      SESSION_TTL_DAYS: "30"
      UPLOAD_QUOTA_MB: "100"
      SEED: "${SEED:-false}"
      REGISTRATION: "${REGISTRATION:-code}"
      REGISTRATION_CODE: "${REGISTRATION_CODE:-}"
      UPLOADS_TOTAL_MB: "${UPLOADS_TOTAL_MB:-5000}"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kanalik

volumes:
  kanalik-data:
  caddy-data:
  caddy-config:
